<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homney — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>

/* ═══════════════════════════════════════════════════════
   ANIMACIONES DE LOGO
═══════════════════════════════════════════════════════ */
@keyframes logoEntrance {
  0%   { transform: scale(.25) rotate(-25deg); opacity: 0; filter: blur(6px); }
  65%  { transform: scale(1.12) rotate(5deg);  opacity: 1; filter: blur(0); }
  82%  { transform: scale(.94) rotate(-2deg); }
  100% { transform: scale(1)   rotate(0);      opacity: 1; }
}
@keyframes logoPulse {
  0%   { transform: scale(1); }
  22%  { transform: scale(1.45) rotate(12deg); }
  50%  { transform: scale(1.1)  rotate(-5deg); }
  75%  { transform: scale(1.2)  rotate(3deg);  }
  100% { transform: scale(1)    rotate(0);     }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes spin { to { transform: rotate(360deg); } }

.logo-entrance { animation: logoEntrance .8s cubic-bezier(.34,1.3,.64,1) both; }
.logo-pulse    { animation: logoPulse .65s cubic-bezier(.34,1.56,.64,1) both !important; }

/* ═══════════════════════════════════════════════════════
   NAV SVG ICONS
═══════════════════════════════════════════════════════ */
.nav-svg {
  width: 17px; height: 17px;
  flex-shrink: 0;
  opacity: .65;
  transition: opacity .15s;
}
.nav-item:hover .nav-svg,
.nav-item.active .nav-svg { opacity: 1; }

/* ═══════════════════════════════════════════════════════
   TOPBAR
═══════════════════════════════════════════════════════ */
#topbar {
  height: 60px;
  border-bottom: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 14px;
  background: rgba(255,255,255,.94);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 50;
  flex-shrink: 0;
}
#topbar h2 {
  font-size: 1.08rem;
  font-weight: 800;
  flex: 1;
  color: var(--text);
  letter-spacing: -.015em;
}
.topbar-actions { display: flex; gap: 8px; }

/* ═══════════════════════════════════════════════════════
   SIDEBAR LOGO MARK
═══════════════════════════════════════════════════════ */
.sidebar-logo .logo-mini {
  width: 38px; height: 38px;
  border-radius: 11px;
  background: linear-gradient(135deg, var(--accent), #FFE060);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 3px 12px rgba(245,197,24,.32);
  flex-shrink: 0;
}

/* ═══════════════════════════════════════════════════════
   MODAL ICON BADGE
═══════════════════════════════════════════════════════ */
.modal h3 {
  font-size: 1.1rem;
  font-weight: 800;
  margin-bottom: 22px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: -.01em;
}
.modal-icon {
  width: 34px; height: 34px;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.modal-icon.y { background: var(--accent-bg); color: var(--accent-dark); }
.modal-icon.g { background: var(--green-bg);  color: var(--green-dark);  }
.modal-icon.b { background: #EEF2FF;           color: #4F46E5;            }
.modal-icon.o { background: var(--warn-bg);    color: var(--warn);        }
.modal-icon svg { width: 18px; height: 18px; }

/* ═══════════════════════════════════════════════════════
   BOTTOM NAV (mobile)
═══════════════════════════════════════════════════════ */
#bottom-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 64px;
  background: var(--surface);
  border-top: 1.5px solid var(--border);
  z-index: 200;
  padding: 0 8px;
  align-items: center;
  justify-content: space-around;
  box-shadow: 0 -4px 20px rgba(100,80,20,.08);
}
.bnav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 10px;
  border-radius: 10px;
  border: none;
  background: none;
  cursor: pointer;
  color: var(--muted);
  font-size: .65rem;
  font-weight: 600;
  font-family: inherit;
  transition: all .15s;
  min-width: 52px;
}
.bnav-item svg { width: 22px; height: 22px; }
.bnav-item.active { color: var(--accent-dark); background: var(--accent-bg); }
.bnav-item:hover  { color: var(--text); background: var(--surface2); }

/* ── Sidebar overlay mobile ── */
#sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(45,36,22,.42);
  z-index: 99;
  backdrop-filter: blur(2px);
}
#sidebar-overlay.open { display: block; }

/* ── Spinner ── */
.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(45,36,22,.18);
  border-top-color: currentColor;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  display: inline-block;
  vertical-align: middle;
}

/* ═══════════════════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════════════════ */
@media (max-width: 768px) {
  #bottom-nav    { display: flex; }
  #content       { padding-bottom: 80px; }
  .grid-form-2   { grid-template-columns: 1fr; }
}
@media (min-width: 769px) {
  #sidebar { transform: none !important; }
}

</style>
</head>
<body>

<div id="toast"></div>

<!-- ══════════════════════════════════════════════════════
     APP SHELL
══════════════════════════════════════════════════════ -->
<div id="app" style="display:flex;height:100vh;overflow:hidden">

  <!-- Overlay sidebar mobile -->
  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mini logo-entrance" id="sidebar-logo-mark">
        <svg width="20" height="20" viewBox="0 0 40 40" fill="none">
          <path d="M20 4L34 12V28L20 36L6 28V12L20 4Z"
                fill="rgba(45,36,22,.14)" stroke="rgba(45,36,22,.42)" stroke-width="2"/>
          <path d="M20 9L30 15V25L20 31L10 25V15L20 9Z"
                fill="rgba(45,36,22,.07)" stroke="rgba(45,36,22,.22)" stroke-width="1.2"/>
          <circle cx="20" cy="20" r="4.5" fill="rgba(45,36,22,.56)"/>
        </svg>
      </div>
      <div>
        <div class="brand">Homney</div>
        <div class="brand-sub" id="sidebar-hogar-sub">Tu colmena</div>
      </div>
    </div>

    <div class="sidebar-nav">
      <div class="nav-label">Principal</div>

      <button class="nav-item active" onclick="navigate('dashboard')" data-page="dashboard">
        <svg class="nav-svg" viewBox="0 0 20 20" fill="none">
          <rect x="2" y="2" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.7"/>
          <rect x="11" y="2" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.7"/>
          <rect x="2" y="11" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.7"/>
          <rect x="11" y="11" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.7"/>
        </svg>
        Dashboard
      </button>

      <button class="nav-item" onclick="navigate('hogar')" data-page="hogar">
        <svg class="nav-svg" viewBox="0 0 20 20" fill="none">
          <path d="M3 9.5L10 3l7 6.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5 8v8a1 1 0 001 1h3v-4h2v4h3a1 1 0 001-1V8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Mi Hogar
      </button>

      <button class="nav-item" onclick="navigate('tareas')" data-page="tareas">
        <svg class="nav-svg" viewBox="0 0 20 20" fill="none">
          <rect x="3" y="3" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.7"/>
          <path d="M7 10l2.5 2.5L14 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Tareas
      </button>

      <button class="nav-item" onclick="navigate('cartera')" data-page="cartera">
        <svg class="nav-svg" viewBox="0 0 20 20" fill="none">
          <rect x="2" y="5" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.7"/>
          <path d="M2 9h16" stroke="currentColor" stroke-width="1.7"/>
          <path d="M6 13h2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        Mi Cartera
      </button>

      <button class="nav-item" onclick="navigate('muro')" data-page="muro">
        <svg class="nav-svg" viewBox="0 0 20 20" fill="none">
          <path d="M17 12a2 2 0 01-2 2H6l-3 3V4a2 2 0 012-2h10a2 2 0 012 2v8z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        Muro
      </button>

      <button class="nav-item" onclick="navigate('perfil')" data-page="perfil">
        <svg class="nav-svg" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="7" r="3.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M3 17a7 7 0 0114 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        Mi Perfil
      </button>

      <div class="nav-label">Crear</div>

      <button class="nav-item" onclick="openModalTarea()">
        <svg class="nav-svg" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M10 6.5v7M6.5 10h7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        Nueva Tarea
      </button>

      <button class="nav-item" onclick="openModalGasto()">
        <svg class="nav-svg" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M10 6.5v7M6.5 10h7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        Nuevo Gasto
      </button>

      <button class="nav-item" onclick="openModalPub()">
        <svg class="nav-svg" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M10 6.5v7M6.5 10h7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        Publicar en muro
      </button>

      <div class="nav-label admin-only hidden" id="nav-label-admin">Admin</div>
    </div>

    <div class="sidebar-footer">
      <div class="user-chip" id="user-dropdown-wrap" onclick="toggleDropdown()">
        <div class="avatar-wrap" id="sidebar-avatar-wrap">
          <div class="avatar" id="sidebar-avatar">?</div>
          <img id="sidebar-avatar-img" src="" alt=""
               style="display:none;width:36px;height:36px;border-radius:50%;object-fit:cover">
        </div>
        <div class="user-info">
          <div class="user-name" id="sidebar-name">—</div>
          <div class="user-role" id="sidebar-role">—</div>
        </div>
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"
             style="color:var(--muted);flex-shrink:0">
          <path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="dropdown-menu" id="user-dropdown">
          <div class="dropdown-item" onclick="navigate('perfil')">Mi cuenta</div>
          <div class="dropdown-item" onclick="navigate('cartera')">Mi cartera</div>
          <div class="dropdown-item red" onclick="doLogout()">Cerrar sesion</div>
        </div>
      </div>
    </div>
  </nav><!-- /sidebar -->

  <!-- MAIN -->
  <div id="main">
    <div id="topbar">
      <button class="btn btn-icon btn-sm" onclick="toggleSidebar()"
              style="display:none" id="btn-menu">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M2 4h14M2 9h14M2 14h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <h2 id="topbar-title">Dashboard</h2>
      <div class="topbar-actions" id="topbar-actions"></div>
      <div class="avatar-wrap" style="cursor:pointer" onclick="toggleDropdown()" title="Mi perfil">
        <div class="avatar" id="topbar-avatar">?</div>
        <img id="topbar-avatar-img" src="" alt=""
             style="display:none;width:36px;height:36px;border-radius:50%;object-fit:cover">
      </div>
    </div>
    <div id="content"></div>
  </div>

  <!-- BOTTOM NAV mobile -->
  <nav id="bottom-nav">
    <button class="bnav-item active" onclick="navigate('dashboard')" data-page="dashboard">
      <svg viewBox="0 0 20 20" fill="none">
        <rect x="2" y="2" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.7"/>
        <rect x="11" y="2" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.7"/>
        <rect x="2" y="11" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.7"/>
        <rect x="11" y="11" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.7"/>
      </svg>
      Inicio
    </button>
    <button class="bnav-item" onclick="navigate('tareas')" data-page="tareas">
      <svg viewBox="0 0 20 20" fill="none">
        <rect x="3" y="3" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.7"/>
        <path d="M7 10l2.5 2.5L14 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Tareas
    </button>
    <button class="bnav-item" onclick="navigate('cartera')" data-page="cartera">
      <svg viewBox="0 0 20 20" fill="none">
        <rect x="2" y="5" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.7"/>
        <path d="M2 9h16" stroke="currentColor" stroke-width="1.7"/>
        <path d="M6 13h2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      Cartera
    </button>
    <button class="bnav-item" onclick="navigate('muro')" data-page="muro">
      <svg viewBox="0 0 20 20" fill="none">
        <path d="M17 12a2 2 0 01-2 2H6l-3 3V4a2 2 0 012-2h10a2 2 0 012 2v8z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      </svg>
      Muro
    </button>
    <button class="bnav-item" onclick="navigate('perfil')" data-page="perfil">
      <svg viewBox="0 0 20 20" fill="none">
        <circle cx="10" cy="7" r="3.5" stroke="currentColor" stroke-width="1.7"/>
        <path d="M3 17a7 7 0 0114 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      Perfil
    </button>
  </nav>

</div><!-- /app -->


<!-- ══════════════════════════════════════════════════════
     MODALES
══════════════════════════════════════════════════════ -->

<!-- GASTO -->
<div class="modal-overlay" id="modal-gasto">
  <div class="modal">
    <h3>
      <span class="modal-icon y">
        <svg viewBox="0 0 18 18" fill="none">
          <rect x="2" y="4" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/>
          <path d="M2 8h14" stroke="currentColor" stroke-width="1.8"/>
          <path d="M5 12h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </span>
      <span id="modal-gasto-title">Nuevo Gasto</span>
    </h3>
    <div class="grid-form grid-form-2">
      <div class="field" style="grid-column:1/-1">
        <label>Concepto *</label>
        <input type="text" id="g-concepto" placeholder="Ej: Compra supermercado">
      </div>
      <div class="field">
        <label>Importe (euros) *</label>
        <input type="number" id="g-importe" placeholder="0.00" step="0.01" min="0">
      </div>
      <div class="field">
        <label>Fecha *</label>
        <input type="date" id="g-fecha">
      </div>
      <div class="field">
        <label>Categoria *</label>
        <select id="g-categoria-padre" onchange="onCategPadreChange()">
          <option value="">Cargando categorias...</option>
        </select>
      </div>
      <div class="field hidden" id="g-categoria-hija-wrap">
        <label>Subcategoria</label>
        <select id="g-categoria-hija">
          <option value="">Sin subcategoria</option>
        </select>
      </div>
      <div class="field">
        <label>Modo de pago</label>
        <select id="g-modo">
          <option value="efectivo">Efectivo</option>
          <option value="transferencia">Transferencia</option>
          <option value="tarjeta">Tarjeta</option>
          <option value="bizum">Bizum</option>
        </select>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>Tipo</label>
        <select id="g-tipo">
          <option value="fijo">Fijo (mensual/recurrente)</option>
          <option value="ocasional">Ocasional</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-gasto')">Cancelar</button>
      <button class="btn btn-primary" id="btn-submit-gasto" onclick="submitGasto()">Registrar</button>
    </div>
  </div>
</div>

<!-- TAREA -->
<div class="modal-overlay" id="modal-tarea">
  <div class="modal">
    <h3>
      <span class="modal-icon g">
        <svg viewBox="0 0 18 18" fill="none">
          <rect x="2" y="2" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.8"/>
          <path d="M5 9l3 3 5-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span id="modal-tarea-title">Nueva Tarea</span>
    </h3>
    <div class="field">
      <label>Nombre de la tarea *</label>
      <input type="text" id="t-nombre" placeholder="Ej: Limpiar el bano">
    </div>
    <div class="grid-form grid-form-2">
      <div class="field">
        <label>Habitacion</label>
        <select id="t-habitacion"><option value="">Sin habitacion</option></select>
      </div>
      <div class="field">
        <label>Duracion (min)</label>
        <input type="number" id="t-duracion" placeholder="20" min="1" max="255">
      </div>
      <div class="field">
        <label>Num. veces</label>
        <input type="number" id="t-numveces" value="1" min="1" max="127">
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>Frecuencia *</label>
        <select id="t-frecuencia" onchange="onFrecuenciaChange()">
          <option value="dia">Diaria</option>
          <option value="semana">Semanal</option>
          <option value="mes">Mensual</option>
          <option value="variable">Variable</option>
        </select>
      </div>
    </div>
    <div class="field hidden" id="t-expl-wrap">
      <label>Explicacion frecuencia variable</label>
      <textarea id="t-explicacion" placeholder="Describe cuando se realiza..."></textarea>
    </div>
    <div class="field" id="t-asignar-wrap">
      <label>Asignar a</label>
      <select id="t-asignar-usuario"></select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-tarea')">Cancelar</button>
      <button class="btn btn-primary" id="btn-submit-tarea" onclick="submitTarea()">Crear tarea</button>
    </div>
  </div>
</div>

<!-- HABITACION -->
<div class="modal-overlay" id="modal-hab">
  <div class="modal">
    <h3>
      <span class="modal-icon b">
        <svg viewBox="0 0 18 18" fill="none">
          <path d="M2 9.5L9 3l7 6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 7.5v7a1 1 0 001 1h3v-3.5h2v3.5h3a1 1 0 001-1v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span id="modal-hab-title">Nueva Habitacion</span>
    </h3>
    <div class="field">
      <label>Nombre *</label>
      <input type="text" id="h-nombre" placeholder="Ej: Salon, Habitacion 1...">
    </div>
    <div class="field">
      <label>Tipo</label>
      <select id="h-tipo">
        <option value="generica">Generica</option>
        <option value="cocina">Cocina</option>
        <option value="aseo">Aseo / Bano</option>
        <option value="garaje">Garaje</option>
        <option value="exterior">Exterior / Jardin</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-hab')">Cancelar</button>
      <button class="btn btn-primary" id="btn-submit-hab" onclick="submitHabitacion()">Crear</button>
    </div>
  </div>
</div>

<!-- PUBLICACION MURO -->
<div class="modal-overlay" id="modal-pub">
  <div class="modal">
    <h3>
      <span class="modal-icon o">
        <svg viewBox="0 0 18 18" fill="none">
          <path d="M16 11a2 2 0 01-2 2H5l-3 3V3a2 2 0 012-2h10a2 2 0 012 2v8z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </span>
      <span id="modal-pub-title">Nueva publicacion</span>
    </h3>
    <div class="field">
      <label>Titulo *</label>
      <input type="text" id="p-titulo" placeholder="Ej: Lista de la compra, Aviso importante...">
    </div>
    <div class="field">
      <label>Contenido *</label>
      <textarea id="p-cuerpo" placeholder="Escribe aqui tu mensaje para el hogar..."
                style="min-height:100px"></textarea>
    </div>

<script src="js/app.js"></script>
<script>
/* ── COMPROBACION DE SESION ── */
(function checkSession() {
  const raw = sessionStorage.getItem('homney_user');
  if (!raw) { window.location.href = 'index.html'; return; }

  state.user = JSON.parse(raw);

  /* Mostrar boton menu en mobile */
  if (window.innerWidth <= 768)
    document.getElementById('btn-menu').style.display = 'inline-flex';
  window.addEventListener('resize', () => {
    document.getElementById('btn-menu').style.display =
      window.innerWidth <= 768 ? 'inline-flex' : 'none';
  });

  /* Cargar hogar y entrar */
  loadHogar().then(() => {
    updateSidebar();
    navigate('dashboard');
  });
})();

/* Pulsa el logo del sidebar cuando se abre un modal o navega */
function pulseSidebarLogo() {
  const el = document.getElementById('sidebar-logo-mark');
  if (!el) return;
  el.classList.remove('logo-pulse');
  void el.offsetWidth;
  el.classList.add('logo-pulse');
  setTimeout(() => el.classList.remove('logo-pulse'), 700);
}

/* Interceptar openModalGasto y openModalTarea para animar logo */
const _origOpenGasto = openModalGasto;
openModalGasto = function(...args) {
  pulseSidebarLogo();
  return _origOpenGasto.apply(this, args);
};
const _origSubmitGasto = submitGasto;
submitGasto = function(...args) {
  pulseSidebarLogo();
  return _origSubmitGasto.apply(this, args);
};
const _origSubmitTarea = submitTarea;
submitTarea = function(...args) {
  pulseSidebarLogo();
  return _origSubmitTarea.apply(this, args);
};
</script>
