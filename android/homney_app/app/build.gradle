plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def secretsPropertiesFile = rootProject.file("secrets.properties")
def secretsProperties = new Properties()
if (secretsPropertiesFile.exists()) {
    secretsProperties.load(new FileInputStream(secretsPropertiesFile))
}

android {
    // compileSdk debe ser >= targetSdk
    compileSdk 36

    defaultConfig {
        applicationId "com.homney.app"
        minSdk 25
        targetSdk 36        // Google Play exige Android 16 (API 36) a partir del 31 ago 2026
        versionCode 5
        versionName "1.3.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Clave de Groq inyectada en tiempo de compilación desde secrets.properties
        // (nunca hardcodeada en el código ni subida a git).
        buildConfigField "String", "GROQ_API_KEY", "\"${secretsProperties.getProperty('GROQ_API_KEY', '')}\""
    }

    buildTypes {
        release {
            // Reduce el APK ~40 % y ofusca el código fuente
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    namespace 'com.homney.app'

}
dependencies {
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.github.AnyChart:AnyChart-Android:1.1.5'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.navigation:navigation-fragment:2.9.7'
    implementation 'androidx.navigation:navigation-ui:2.9.7'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.activity:activity:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation platform('com.google.firebase:firebase-bom:34.13.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    // Google Sign-In (necesario para autenticación con Google vía Firebase)
    // Nota: 21.x deprecó GoogleSignIn y requiere Credential Manager; usamos 20.7.0 que es estable
    implementation 'com.google.android.gms:play-services-auth:20.7.0'

}